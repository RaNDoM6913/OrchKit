name: compatibility

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  macos:
    name: macOS arm64 / Python ${{ matrix.python }}
    runs-on: macos-26
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python:
          - "3.9"
          - "3.12"

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Environment
        run: |
          sw_vers
          uname -m
          git --version
          python --version

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Compile
        run: python -m compileall -q orch tests

      - name: Install package
        run: python -m pip install .

      - name: CLI smoke
        run: orch --version
