name: compatibility

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  macos:
    name: macOS arm64 / Python ${{ matrix.python }}
    runs-on: macos-26
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python:
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Environment
        run: |
          sw_vers
          uname -m
          git --version
          python --version

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Compile
        run: python -m compileall -q orch tests scripts

      - name: Install build tools
        run: python -m pip install build twine

      - name: Build and validate distributions
        run: |
          # Default build creates the wheel from the sdist, not the checkout.
          python -m build --outdir "$RUNNER_TEMP/orchkit-dist"
          python -m twine check --strict "$RUNNER_TEMP/orchkit-dist"/*
          shasum -a 256 "$RUNNER_TEMP/orchkit-dist"/*

      - name: Installed-wheel smoke
        run: |
          python -m venv "$RUNNER_TEMP/orchkit-smoke"
          "$RUNNER_TEMP/orchkit-smoke/bin/python" -m pip install --no-index "$RUNNER_TEMP/orchkit-dist"/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/orchkit-smoke/bin/python" -I "$GITHUB_WORKSPACE/scripts/check_installed_package.py" "$GITHUB_WORKSPACE"
