[metadata]
name = orchkit
version = 0.11.0
description = ChatGPT-first durable workflow orchestrator for local development projects
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/RaNDoM6913/OrchKit
license = Apache-2.0
project_urls =
    Source = https://github.com/RaNDoM6913/OrchKit
    Issues = https://github.com/RaNDoM6913/OrchKit/issues
    Documentation = https://github.com/RaNDoM6913/OrchKit/tree/main/docs
classifiers =
    Development Status :: 3 - Alpha
    License :: OSI Approved :: Apache Software License
    Programming Language :: Python :: 3

[options]
python_requires = >=3.9
packages = find:
include_package_data = True

[options.packages.find]
include =
    orch
    orch.*
exclude =
    tests
    tests.*
    fixtures
    fixtures.*
    spikes
    spikes.*

[options.package_data]
orch =
    templates/*.txt

[options.entry_points]
console_scripts =
    orch = orch.cli:main
