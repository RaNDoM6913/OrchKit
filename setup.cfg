[metadata]
name = agent-workflow-orchestrator
version = 0.9.0
description = ChatGPT-first durable workflow orchestrator for local development projects
long_description = file: README.md
long_description_content_type = text/markdown

[options]
python_requires = >=3.9
packages = find:
include_package_data = True

[options.packages.find]
include =
    orch
    orch.*
exclude =
    tests
    tests.*
    fixtures
    fixtures.*
    spikes
    spikes.*

[options.package_data]
orch =
    templates/*.txt

[options.entry_points]
console_scripts =
    orch = orch.cli:main
